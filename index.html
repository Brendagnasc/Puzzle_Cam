<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Puzzle Cam</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: #eee;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 20px;
    }
    h1 { letter-spacing: 4px; font-size: 20px; margin: 0; }
    #status { color: #999; font-size: 14px; }
    canvas {
      border: 2px solid #444;
      border-radius: 8px;
      max-width: 100%;
      display: block;
    }
    video { display: none; }

    #palco { position: relative; }
    #menu {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: rgba(0, 0, 0, 0.6);
      border-radius: 8px;
    }
    #tituloMenu { font-size: 22px; letter-spacing: 2px; }
    #opcoesMenu { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

    #menu button, #acoes button {
      font-family: monospace;
      font-size: 16px;
      padding: 10px 24px;
      background: #222;
      color: #eee;
      border: 2px solid #555;
      border-radius: 8px;
      cursor: pointer;
    }
    #menu button:hover, #acoes button:hover { border-color: #ffcc00; }
  </style>
</head>
<body>
  <h1>PUZZLE CAM</h1>
  <div id="status">Carregando modelo de mãos...</div>
  <video id="webcam" autoplay playsinline></video>

  <div id="palco">
    <canvas id="tela" width="960" height="540"></canvas>
    <div id="menu">
      <div id="tituloMenu">Escolha o jogo</div>
      <div id="opcoesMenu"></div>
      <button id="btnVoltar" style="display: none;">Voltar</button>
    </div>
  </div>

  <div id="acoes" style="display: none; gap: 12px;">
    <button id="btnSalvar">Salvar foto</button>
    <button id="btnReiniciar">Jogar de novo</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

  <script>
    const video = document.getElementById("webcam");
    const canvas = document.getElementById("tela");
    const ctx = canvas.getContext("2d");
    const status = document.getElementById("status");

    const menu = document.getElementById("menu");
    const tituloMenu = document.getElementById("tituloMenu");
    const opcoesMenu = document.getElementById("opcoesMenu");
    const btnVoltar = document.getElementById("btnVoltar");

    // limiares da pinça: distância polegar-indicador dividida pelo tamanho da mão.
    // dois limiares (histerese): fecha abaixo de um, só abre acima do outro.
    // assim a pinça não fica oscilando quando a distância está perto do limite
    const LIMIAR_FECHAR = 0.30;
    const LIMIAR_ABRIR = 0.45;

    // suavização do cursor (0 a 1): quanto menor, mais suave e mais "atrasado"
    const SUAVIZACAO = 0.4;

    // por quanto tempo a mão pode sumir da detecção sem soltar a peça
    const TOLERANCIA_PERDA_MS = 250;

    const DURACAO_CONTAGEM = 3; // segundos

    // configuração do menu: adicionar um jogo ou nível é só acrescentar uma entrada
    const JOGOS = {
      puzzle: { nome: "Puzzle Cam" }
    };

    const NIVEIS = {
      facil:   { nome: "Fácil",   linhas: 2, colunas: 3 },
      medio:   { nome: "Médio",   linhas: 3, colunas: 4 },
      dificil: { nome: "Difícil", linhas: 4, colunas: 6 }
    };

    // definidos pelo nível escolhido no menu
    let LINHAS = 3;
    let COLUNAS = 4;

    // região central da tela onde o quebra-cabeça será montado
    const tabuleiro = { x: 0, y: 0, largura: 0, altura: 0, celula: 0 };
    let pecas = [];

    // estados: "menuJogo" -> "menuNivel" -> "rastreando" -> "contagem" -> "montando" -> "completo"
    let estado = "menuJogo";
    let jogoSelecionado = null;
    let fimContagem = 0;
    let foto = null; // canvas offscreen com a foto congelada

    let pecaSegura = null;      // peça que está sendo segurada
    let deslocamento = { x: 0, y: 0 };
    let pincavaAntes = false;   // pinça do frame anterior

    let resultadoMaos = null;

    // estado do cursor controlado pela mão
    const cursor = {
      x: 0,
      y: 0,
      pincando: false,
      visivel: false,
      ultimaDeteccao: 0 // performance.now() da última vez que a mão foi vista
    };

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.6
    });

    hands.onResults((resultados) => {
      resultadoMaos = resultados;
    });

    const camera = new Camera(video, {
      onFrame: async () => {
        await hands.send({ image: video });
      },
      width: 1280,
      height: 720
    });

    camera.start().then(() => {
      status.textContent = "Escolha o jogo para começar";
      desenhar();
    }).catch((erro) => {
      status.textContent = "Erro ao acessar a webcam: " + erro.message;
    });

    // ---------- menu ----------

    // gera um botão para cada item do objeto de configuração
    function criarBotoesMenu(itens, aoClicar) {
      opcoesMenu.innerHTML = "";
      for (const chave of Object.keys(itens)) {
        const botao = document.createElement("button");
        botao.textContent = itens[chave].nome;
        botao.addEventListener("click", () => aoClicar(chave));
        opcoesMenu.appendChild(botao);
      }
    }

    function mostrarMenuJogo() {
      estado = "menuJogo";
      status.textContent = "Escolha o jogo para começar";
      tituloMenu.textContent = "Escolha o jogo";
      btnVoltar.style.display = "none";
      criarBotoesMenu(JOGOS, (chave) => {
        jogoSelecionado = chave;
        mostrarMenuNivel();
      });
      menu.style.display = "flex";
    }

    function mostrarMenuNivel() {
      estado = "menuNivel";
      status.textContent = "Escolha o nível";
      tituloMenu.textContent = "Escolha o nível";
      btnVoltar.style.display = "block";
      criarBotoesMenu(NIVEIS, (chave) => {
        LINHAS = NIVEIS[chave].linhas;
        COLUNAS = NIVEIS[chave].colunas;
        iniciarJogo();
      });
    }

    function iniciarJogo() {
      menu.style.display = "none";
      estado = "rastreando";
    }

    // ---------- visão computacional ----------

    function distancia(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function atualizarCursor(marcos) {
      const polegar = marcos[4];   // ponta do polegar
      const indicador = marcos[8]; // ponta do indicador

      // tamanho de referência da mão: pulso (0) até a base do dedo médio (9).
      // normalizar por isso deixa o limiar independente da distância da câmera
      const tamanhoMao = distancia(marcos[0], marcos[9]);
      const aberturaPinca = distancia(polegar, indicador) / tamanhoMao;

      // cursor fica no ponto médio entre os dois dedos, já espelhado
      const alvoX = (1 - (polegar.x + indicador.x) / 2) * canvas.width;
      const alvoY = ((polegar.y + indicador.y) / 2) * canvas.height;

      if (cursor.visivel) {
        // média móvel exponencial: tira a tremedeira dos landmarks
        cursor.x += (alvoX - cursor.x) * SUAVIZACAO;
        cursor.y += (alvoY - cursor.y) * SUAVIZACAO;
      } else {
        // mão acabou de aparecer: vai direto para a posição, sem "deslizar"
        cursor.x = alvoX;
        cursor.y = alvoY;
      }

      cursor.pincando = cursor.pincando
        ? aberturaPinca < LIMIAR_ABRIR
        : aberturaPinca < LIMIAR_FECHAR;
      cursor.visivel = true;
      cursor.ultimaDeteccao = performance.now();
    }

    function limitar(valor, minimo, maximo) {
      return Math.min(Math.max(valor, minimo), maximo);
    }

    function embaralhar(lista) {
      // Fisher-Yates
      for (let i = lista.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [lista[i], lista[j]] = [lista[j], lista[i]];
      }
      return lista;
    }

    function desenharMao(marcos) {
      const pontos = marcos.map(p => ({
        x: (1 - p.x) * canvas.width,
        y: p.y * canvas.height
      }));

      ctx.strokeStyle = "rgba(0, 255, 136, 0.5)";
      ctx.lineWidth = 2;
      for (const [a, b] of HAND_CONNECTIONS) {
        ctx.beginPath();
        ctx.moveTo(pontos[a].x, pontos[a].y);
        ctx.lineTo(pontos[b].x, pontos[b].y);
        ctx.stroke();
      }
    }

    function desenharCursor() {
      if (!cursor.visivel) return;
      ctx.beginPath();
      ctx.arc(cursor.x, cursor.y, cursor.pincando ? 12 : 18, 0, Math.PI * 2);
      ctx.lineWidth = 4;
      if (cursor.pincando) {
        ctx.fillStyle = "rgba(255, 204, 0, 0.9)";
        ctx.fill();
      } else {
        ctx.strokeStyle = "rgba(255, 255, 255, 0.9)";
        ctx.stroke();
      }
    }

    // ---------- captura e quebra-cabeça ----------

    function iniciarContagem() {
      estado = "contagem";
      fimContagem = performance.now() + DURACAO_CONTAGEM * 1000;
    }

    function capturarFoto() {
      foto = document.createElement("canvas");
      foto.width = canvas.width;
      foto.height = canvas.height;
      const fctx = foto.getContext("2d");

      // captura já espelhada, para a foto ficar igual ao que o usuário vê na tela
      fctx.translate(foto.width, 0);
      fctx.scale(-1, 1);
      fctx.drawImage(video, 0, 0, foto.width, foto.height);

      criarPecas();
      estado = "montando";
    }

    function criarPecas() {
      // tabuleiro ocupa 60% da largura, centralizado
      tabuleiro.largura = canvas.width * 0.6;
      tabuleiro.celula = tabuleiro.largura / COLUNAS;
      tabuleiro.altura = tabuleiro.celula * LINHAS;
      tabuleiro.x = (canvas.width - tabuleiro.largura) / 2;
      tabuleiro.y = (canvas.height - tabuleiro.altura) / 2;

      const posicoes = gerarPosicoesLaterais(LINHAS * COLUNAS);

      pecas = [];
      for (let l = 0; l < LINHAS; l++) {
        for (let c = 0; c < COLUNAS; c++) {
          const destinoX = tabuleiro.x + c * tabuleiro.celula;
          const destinoY = tabuleiro.y + l * tabuleiro.celula;
          const inicial = posicoes.pop(); // posição embaralhada, fora do tabuleiro
          pecas.push({
            sx: destinoX,  // recorte na foto
            sy: destinoY,
            destinoX,      // lugar certo no tabuleiro
            destinoY,
            x: inicial.x,  // posição atual
            y: inicial.y,
            colocada: false
          });
        }
      }
    }

    // distribui n posições nas duas faixas laterais (fora do tabuleiro),
    // em uma grade com um pouco de variação, e embaralha a ordem
    function gerarPosicoesLaterais(n) {
      const c = tabuleiro.celula;
      const larguraFaixa = tabuleiro.x; // as duas faixas têm a mesma largura
      const alturaUtil = canvas.height - c;
      const posicoes = [];

      const faixas = [
        { inicio: 0, quantidade: Math.ceil(n / 2) },                                  // esquerda
        { inicio: tabuleiro.x + tabuleiro.largura, quantidade: Math.floor(n / 2) }    // direita
      ];

      for (const faixa of faixas) {
        const k = faixa.quantidade;
        if (k === 0) continue;

        // quantas colunas de peças cabem lado a lado na faixa
        const colunas = limitar(Math.floor(larguraFaixa / c), 1, k);
        const linhas = Math.ceil(k / colunas);
        const folgaX = Math.max(0, larguraFaixa - c);
        const passoX = colunas > 1 ? folgaX / (colunas - 1) : 0;
        const passoY = linhas > 1 ? alturaUtil / (linhas - 1) : 0;

        const minX = faixa.inicio;
        const maxX = faixa.inicio + folgaX;

        for (let i = 0; i < k; i++) {
          const col = i % colunas;
          const lin = Math.floor(i / colunas);
          const baseX = colunas > 1 ? minX + col * passoX : minX + folgaX / 2;
          const baseY = linhas > 1 ? lin * passoY : alturaUtil / 2;
          const variacao = c * 0.1;
          posicoes.push({
            x: limitar(baseX + (Math.random() - 0.5) * variacao, minX, maxX),
            y: limitar(baseY + (Math.random() - 0.5) * variacao, 0, alturaUtil)
          });
        }
      }

      return embaralhar(posicoes);
    }

    function desenharTabuleiro() {
      ctx.strokeStyle = "rgba(255, 255, 255, 0.5)";
      ctx.lineWidth = 2;
      for (let l = 0; l < LINHAS; l++) {
        for (let c = 0; c < COLUNAS; c++) {
          ctx.strokeRect(
            tabuleiro.x + c * tabuleiro.celula,
            tabuleiro.y + l * tabuleiro.celula,
            tabuleiro.celula,
            tabuleiro.celula
          );
        }
      }
    }

    function desenharPecas() {
      for (const p of pecas) {
        ctx.drawImage(
          foto,
          p.sx, p.sy, tabuleiro.celula, tabuleiro.celula,  // origem: recorte na foto
          p.x, p.y, tabuleiro.celula, tabuleiro.celula     // destino: posição atual
        );
        ctx.strokeStyle = p.colocada ? "rgba(0, 255, 136, 0.9)" : "rgba(255, 204, 0, 0.9)";
        ctx.lineWidth = 3;
        ctx.strokeRect(p.x, p.y, tabuleiro.celula, tabuleiro.celula);
      }
    }

    function pegarPeca() {
      // percorre de trás para frente: a última desenhada está por cima
      for (let i = pecas.length - 1; i >= 0; i--) {
        const p = pecas[i];
        if (p.colocada) continue;
        if (
          cursor.x >= p.x && cursor.x <= p.x + tabuleiro.celula &&
          cursor.y >= p.y && cursor.y <= p.y + tabuleiro.celula
        ) {
          pecaSegura = p;
          deslocamento.x = cursor.x - p.x;
          deslocamento.y = cursor.y - p.y;

          // move a peça para o fim do array, para ser desenhada por cima das outras
          pecas.splice(i, 1);
          pecas.push(p);
          return;
        }
      }
    }

    function soltarPeca() {
      const p = pecaSegura;
      pecaSegura = null;
      if (!p) return;

      const dist = Math.hypot(p.x - p.destinoX, p.y - p.destinoY);
      if (dist < tabuleiro.celula * 0.3) {
        p.x = p.destinoX;
        p.y = p.destinoY;
        p.colocada = true;

        if (pecas.every(pc => pc.colocada)) {
          estado = "completo";
          document.getElementById("acoes").style.display = "flex";
        }
      }
    }

    // ---------- loop principal ----------

    function desenhar() {
      // fundo: vídeo ao vivo
      ctx.save();
      ctx.scale(-1, 1);
      ctx.drawImage(video, -canvas.width, 0, canvas.width, canvas.height);
      ctx.restore();

      // mão e cursor
      if (resultadoMaos && resultadoMaos.multiHandLandmarks.length > 0) {
        const marcos = resultadoMaos.multiHandLandmarks[0];
        atualizarCursor(marcos);
        desenharMao(marcos);
      } else if (performance.now() - cursor.ultimaDeteccao > TOLERANCIA_PERDA_MS) {
        // só considera a mão perdida depois da tolerância; antes disso o cursor
        // fica parado na última posição, mantendo a pinça (e a peça segura)
        cursor.visivel = false;
        cursor.pincando = false;
      }

      // lógica de cada estado
      if (estado === "rastreando") {
        status.textContent = "Feche a pinça para iniciar a captura";
        if (cursor.visivel && cursor.pincando) iniciarContagem();

      } else if (estado === "contagem") {
        const restante = Math.ceil((fimContagem - performance.now()) / 1000);
        if (restante <= 0) {
          capturarFoto();
        } else {
          status.textContent = "Prepare a pose!";
          ctx.fillStyle = "rgba(255, 204, 0, 0.95)";
          ctx.font = "bold 160px monospace";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(restante, canvas.width / 2, canvas.height / 2);
        }

      } else if (estado === "montando") {
        status.textContent = "Monte o quebra-cabeça!";

        // eventos de borda da pinça
        if (cursor.visivel) {
          if (cursor.pincando && !pincavaAntes) {
            pegarPeca();
          } else if (!cursor.pincando && pincavaAntes) {
            soltarPeca();
          }
        } else if (pecaSegura) {
          soltarPeca(); // mão saiu da câmera segurando peça
        }

        // peça segura acompanha o cursor
        if (pecaSegura) {
          pecaSegura.x = cursor.x - deslocamento.x;
          pecaSegura.y = cursor.y - deslocamento.y;
        }

        desenharTabuleiro();
        desenharPecas();

      } else if (estado === "completo") {
        status.textContent = "Quebra-cabeça completo!";

        // a foto inteira no lugar do tabuleiro: peças viram uma imagem só
        ctx.drawImage(
          foto,
          tabuleiro.x, tabuleiro.y, tabuleiro.largura, tabuleiro.altura,
          tabuleiro.x, tabuleiro.y, tabuleiro.largura, tabuleiro.altura
        );
        ctx.strokeStyle = "rgba(0, 255, 136, 0.9)";
        ctx.lineWidth = 4;
        ctx.strokeRect(tabuleiro.x, tabuleiro.y, tabuleiro.largura, tabuleiro.altura);

        ctx.fillStyle = "rgba(0, 255, 136, 0.95)";
        ctx.font = "bold 64px monospace";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("COMPLETO!", canvas.width / 2, tabuleiro.y - 40);
      }

      // rodam em todo frame, independente do estado
      desenharCursor();
      pincavaAntes = cursor.visivel && cursor.pincando;
      requestAnimationFrame(desenhar);
    }

    // ---------- botões ----------

    btnVoltar.addEventListener("click", mostrarMenuJogo);

    document.getElementById("btnSalvar").addEventListener("click", () => {
      const link = document.createElement("a");
      link.download = "puzzle-cam.png";
      link.href = foto.toDataURL("image/png");
      link.click();
    });

    document.getElementById("btnReiniciar").addEventListener("click", () => {
      foto = null;
      pecas = [];
      pecaSegura = null;
      document.getElementById("acoes").style.display = "none";
      mostrarMenuJogo();
    });

    mostrarMenuJogo();
  </script>
</body>
</html>
