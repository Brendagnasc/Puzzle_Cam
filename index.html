<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Puzzle Cam</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: #eee;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 20px;
    }
    h1 { letter-spacing: 4px; font-size: 20px; margin: 0; }
    #status { color: #999; font-size: 14px; }
    canvas {
      border: 2px solid #444;
      border-radius: 8px;
      max-width: 100%;
    }
    video { display: none; }
  </style>
</head>
<body>
  <h1>PUZZLE CAM</h1>
  <div id="status">Carregando modelo de mãos...</div>
  <video id="webcam" autoplay playsinline></video>
  <canvas id="tela" width="960" height="540"></canvas>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

  <script>
    const video = document.getElementById("webcam");
    const canvas = document.getElementById("tela");
    const ctx = canvas.getContext("2d");
    const status = document.getElementById("status");

    // limiar da pinça: distância polegar-indicador dividida pelo tamanho da mão
    const LIMIAR_PINCA = 0.35;

    const DURACAO_CONTAGEM = 3; // segundos

    const LINHAS = 3;
    const COLUNAS = 4;

    // regiao centrak da tela onde o quebra-cabecas será montado
    const tabuleiro = { x: 0, y: 0, largura: 0, altura: 0, celula: 0};
    let pecas = [];

    // estados possiveis: "rastreando" -> "contagem" -> "capturado"
    let estado = "rastreando";
    let fimContagem = 0; 
    let foto = null; // canvas offscreen com a foto congelada

    let resultadoMaos = null;

    // estado do cursor controlado pela mão
    const cursor = {
      x: 0,
      y: 0,
      pincando: false,
      visivel: false
    };

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.6
    });

    hands.onResults((resultados) => {
      resultadoMaos = resultados;
    });

    const camera = new Camera(video, {
      onFrame: async () => {
        await hands.send({ image: video });
      },
      width: 1280,
      height: 720
    });

    camera.start().then(() => {
      status.textContent = "Mostre a mão para a câmera";
      desenhar();
    }).catch((erro) => {
      status.textContent = "Erro ao acessar a webcam: " + erro.message;
    });

    function distancia(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function atualizarCursor(marcos) {
      const polegar = marcos[4];   // ponta do polegar
      const indicador = marcos[8]; // ponta do indicador

      // tamanho de referência da mão: pulso (0) até a base do dedo médio (9).
      // normalizar por isso deixa o limiar independente da distância da câmera
      const tamanhoMao = distancia(marcos[0], marcos[9]);
      const aberturaPinca = distancia(polegar, indicador) / tamanhoMao;

      // cursor fica no ponto médio entre os dois dedos, já espelhado
      cursor.x = (1 - (polegar.x + indicador.x) / 2) * canvas.width;
      cursor.y = ((polegar.y + indicador.y) / 2) * canvas.height;
      cursor.pincando = aberturaPinca < LIMIAR_PINCA;
      cursor.visivel = true;
    }

    function iniciarContagem() {
      estado = "contagem";
      fimContagem = performance.now() + DURACAO_CONTAGEM * 1000;
    }

    function capturarFoto() {
      foto = document.createElement("canvas");
      foto.width = canvas.width;
      foto.height = canvas.height;
      const fctx = foto.getContext("2d");

      // captura já espelhada, para a foto ficar igual ao que o usuário vê na tela
      fctx.translate(foto.width, 0);
      fctx.scale(-1, 1);
      fctx.drawImage(video, 0, 0, foto.width, foto.height);

      criarPecas();
      estado = "montando";
    }
      
    function desenharMao(marcos) {
      const pontos = marcos.map(p => ({
        x: (1 - p.x) * canvas.width,
        y: p.y * canvas.height
      }));

      ctx.strokeStyle = "rgba(0, 255, 136, 0.5)";
      ctx.lineWidth = 2;
      for (const [a, b] of HAND_CONNECTIONS) {
        ctx.beginPath();
        ctx.moveTo(pontos[a].x, pontos[a].y);
        ctx.lineTo(pontos[b].x, pontos[b].y);
        ctx.stroke();
      }
    }

    function desenharCursor() {
      if (!cursor.visivel) return;
      ctx.beginPath();
      ctx.arc(cursor.x, cursor.y, cursor.pincando ? 12 : 18, 0, Math.PI * 2);
      ctx.lineWidth = 4;
      if (cursor.pincando) {
        ctx.fillStyle = "rgba(255, 204, 0, 0.9)";
        ctx.fill();
      } else {
        ctx.strokeStyle = "rgba(255, 255, 255, 0.9)";
        ctx.stroke();
      }
    }

    function criarPecas() {
      //tabuleiro ocupa 60% da largura, centralizado
      tabuleiro.largura = canvas.width * 0.6;
      tabuleiro.celula = tabuleiro.largura / COLUNAS;
      tabuleiro.altura = tabuleiro.celula * LINHAS;
      tabuleiro.x = (canvas.width - tabuleiro.largura) / 2;
      tabuleiro.y = (canvas.height - tabuleiro.altura) / 2;

      pecas = [];
      for (let l = 0; l < LINHAS; l++) {
        for (let c = 0; c < COLUNAS; c++) {
          const destinoX = tabuleiro.x + c * tabuleiro.celula;
          const destinoY = tabuleiro.y + l * tabuleiro.celula;
          pecas.push({
            sx: destinoX, //recorte na foto
            sy: destinoY,
            destinoX,     //lucar certo no tabuleiro
            destinoY,
            x: Math.random() * (canvas.width - tabuleiro.celula), //posicao atual
            y: Math.random() * (canvas.height - tabuleiro.celula), //embaralha
            colocada: false
          });
        }
      }
    }

    function desenhar() {
      // fundo: video ao vivo, ou a foto congelada se ja capturou
      if (estado === "capturado" && foto) {
        ctx.drawImage(foto, 0, 0);
      } else {
        ctx.save();
        ctx.scale(-1, 1);
        ctx.drawImage(video, -canvas.width, 0, canvas.width, canvas.height);
        ctx.restore();
      }

      // mao e cursor
      if (resultadoMaos && resultadoMaos.multiHandLandmarks.length > 0) {
        const marcos = resultadoMaos.multiHandLandmarks[0];
        atualizarCursor(marcos);
        desenharMao(marcos);
      } else {
        cursor.visivel = false;
      }

      // logica de estados
      if (estado === "rastreando") {
        status.textContent = "Feche a pinça para iniciar a captura";
        if (cursor.visivel && cursor.pincando) iniciarContagem();

      } else if (estado === "contagem") {
        const restante = Math.ceil((fimContagem - performance.now()) / 1000);
        if (restante <= 0) {
          capturarFoto();
        } else {
          status.textContent = "Preparar a pose!";
          ctx.fillStyle = "rgba(255, 204, 0, 0.95)";
          ctx.font = "bold 160px monospace";
          ctx.textAlign = "center";
          ctx.fillText(restante, canvas.width / 2, canvas.height / 2);
        }
     
      } else if (estado === "montando") {
        status.textContent = "Monte o quebra-cabeça!";
        desenharTabuleiro();
        desenharPecas();
      }

      desenharCursor();
      requestAnimationFrame(desenhar);
    }

    function desenharTabuleiro() {
      ctx.strokeStyle = "rgba(255, 255, 255, 0.5)";
      ctx.lineWidth = 2;
      for (let l = 0; l < LINHAS; l++) {
        for (let c = 0; c < COLUNAS; c++) {
          ctx.strokeRect(
            tabuleiro.x + c * tabuleiro.celula,
            tabuleiro.y + l * tabuleiro.celula,
            tabuleiro.celula,
            tabuleiro.celula
          );
        }
      }
    }

    function desenharPecas() {
      for (const p of pecas) {
        ctx.drawImage(
          foto,
          p.sx, p.sy, tabuleiro.celula, tabuleiro.celula,  // origem: recorte na foto
          p.x, p.y, tabuleiro.celula, tabuleiro.celula      // destino: posição atual
        );
        ctx.strokeStyle = p.colocada ? "rgba(0, 255, 136, 0.9)" : "rgba(255, 204, 0, 0.9)";
        ctx.lineWidth = 3;
        ctx.strokeRect(p.x, p.y, tabuleiro.celula, tabuleiro.celula);
      }
    }

  </script>
</body>
</html>
